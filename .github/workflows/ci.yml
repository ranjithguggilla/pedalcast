name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  build-model:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Train and export model
        run: python -m pedalcast.train
      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: pedalcast-model
          path: |
            models/pedalcast_model.joblib
            outputs/metrics.json
