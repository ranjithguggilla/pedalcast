[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedalcast"
version = "0.1.0"
description = "Hourly bike-share demand forecasting for fleet rebalancing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "polars>=1.10",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "streamlit>=1.39",
]

[project.scripts]
pedalcast-train = "pedalcast.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
